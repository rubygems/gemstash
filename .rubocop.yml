inherit_from: .rubocop-bundler.yml
plugins:
  - rubocop-performance
AllCops:
  NewCops: disable
  Exclude:
    - bin/**/*
    - tmp/**/*
    - vendor/**/*
    - gemfiles/**/*
  DisplayCopNames: true
  TargetRubyVersion: 3.3
  SuggestExtensions: false

# Fixture gems keep their own Ruby requirement.
Gemspec/RequiredRubyVersion:
  Exclude:
    - spec/data/**/*.gemspec
