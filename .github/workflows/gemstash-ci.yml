name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  gemstash_tests:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0", "jruby-10.0", "jruby-10.1"]
        db_adapter: ["sqlite3"]
        cache_type: ["memory"]
        include:
          - ruby: "4.0"
            db_adapter: "postgres"
            cache_type: "memory"
          - ruby: "4.0"
            db_adapter: "mysql2"
            cache_type: "memory"
          - ruby: "4.0"
            db_adapter: "sqlite3"
            cache_type: "memcached"
          - ruby: "4.0"
            db_adapter: "sqlite3"
            cache_type: "redis"
          - ruby: "jruby-10.1"
            db_adapter: "sqlite3"
            cache_type: "memcached"
          - ruby: "jruby-10.1"
            db_adapter: "sqlite3"
            cache_type: "redis"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gemstash_test
        ports:
          - 5432:5432
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
      redis:
        image: redis:8
        ports:
          - 6379:6379
      mysql:
        # Only the mysql2 job starts MySQL; an empty image skips the service.
        image: ${{ matrix.db_adapter == 'mysql2' && 'mysql:9.7' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gemstash_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      GEMSTASH_SPEC_CACHE_TYPE: ${{ matrix.cache_type }}
      GEMSTASH_SPEC_DB_ADAPTER: ${{ matrix.db_adapter }}
      GEMSTASH_SPEC_DB_URL: ${{ (matrix.db_adapter == 'postgres' && 'postgres://postgres:postgres@localhost/gemstash_test') || (matrix.db_adapter == 'mysql2' && 'mysql2://root:root@127.0.0.1:3306/gemstash_test') }}
      GEMSTASH_SPEC_REDIS_SERVERS: redis://localhost:6379
      GEMSTASH_SPEC_MEMCACHED_SERVERS: localhost:11211
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Setup ruby
        uses: ruby/setup-ruby@v1.338.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # 'bundle install' and cache
      - name: increase ulimit
        run: ulimit -n 8192
      - name: Run Tests
        run: bundle exec rspec --exclude-pattern "spec/integration_spec.rb"
      - name: Run Integration Tests
        run: bundle exec rspec ./spec/integration_spec.rb
    timeout-minutes: 60

  all-tests-pass:
    if: always()

    needs:
      - gemstash_tests

    runs-on: ubuntu-26.04

    steps:
      - name: check test jobs
        uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
